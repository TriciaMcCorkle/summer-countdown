<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Summer School Countdown</title>

<style>
body{
  font-family:Arial,sans-serif;
  text-align:center;
  margin:0;
  background:white;
}

.container{
  max-width:1000px;
  margin:auto;
}

img{
  width:100%;
  height:auto;
}

h2{
  margin:10px 0 0 0;
  color:#0b5cab;
}

p{
  margin:5px 0 15px 0;
}
</style>
</head>

<body>

<div class="container">

<h2 id="dayLabel"></h2>
<p id="dateLabel"></p>

<img id="countdownImage" src="1.png">

</div>

<script>

const schoolDays = [
"2026-05-27",
"2026-05-28",
"2026-05-29",
"2026-06-01",
"2026-06-02",
"2026-06-03",
"2026-06-04",
"2026-06-08",
"2026-06-09",
"2026-06-10",
"2026-06-11",
"2026-06-12",
"2026-06-15",
"2026-06-16",
"2026-06-17",
"2026-06-18",
"2026-06-22",
"2026-06-23",
"2026-06-24",
"2026-06-25"
];

const today = new Date();

const localDate =
today.getFullYear() + "-" +
String(today.getMonth()+1).padStart(2,"0") + "-" +
String(today.getDate()).padStart(2,"0");

let dayNumber = 1;

for(let i=0;i<schoolDays.length;i++){
  if(localDate >= schoolDays[i]){
    dayNumber = i + 1;
  }
}

if(localDate < schoolDays[0]){
  dayNumber = 1;
}

if(dayNumber > 20){
  dayNumber = 20;
}

document.getElementById("countdownImage").src =
dayNumber + ".png";

document.getElementById("dayLabel").innerText =
"Day " + dayNumber + " of 20";

document.getElementById("dateLabel").innerText =
today.toLocaleDateString();

</script>

</body>
</html>
