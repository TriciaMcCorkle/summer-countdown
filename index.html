<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Summer Countdown</title>

<style>
body {
  margin:0;
  font-family: Arial;
  text-align:center;
  background:#eaf6ff;
}

.container {
  max-width:800px;
  margin:auto;
  padding:20px;
}

.pool {
  position:relative;
  width:100%;
  height:220px;
  background:#87CEEB;
  border-radius:20px;
  overflow:hidden;
}

/* water */
.water {
  position:absolute;
  bottom:0;
  width:100%;
  height:60%;
  background:#3bb9ff;
}

/* swimmer */
.swimmer {
  position:absolute;
  bottom:40px;
  font-size:60px;
  transition:left 1s ease;
}

/* start + finish */
.start {
  position:absolute;
  left:10px;
  top:10px;
  font-size:30px;
}

.finish {
  position:absolute;
  right:10px;
  top:10px;
  font-size:30px;
}

.bar-bg {
  width:100%;
  height:20px;
  background:#ddd;
  border-radius:10px;
  margin-top:15px;
}

.bar {
  height:100%;
  width:0%;
  background:#4CAF50;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>☀️ Summer School Countdown ☀️</h2>

<div class="pool">
  <div class="start">🌴</div>
  <div class="finish">🏁</div>
  <div class="water"></div>
  <div id="swimmer" class="swimmer">🏊</div>
</div>

<div class="bar-bg">
  <div id="bar" class="bar"></div>
</div>

<h3 id="dayText"></h3>
<p id="dateText"></p>

</div>

<script>

const days = [
"2026-05-27",
"2026-05-28",
"2026-05-29",
"2026-06-01",
"2026-06-02",
"2026-06-03",
"2026-06-04",
"2026-06-08",
"2026-06-09",
"2026-06-10",
"2026-06-11",
"2026-06-12",
"2026-06-15",
"2026-06-16",
"2026-06-17",
"2026-06-18",
"2026-06-22",
"2026-06-23",
"2026-06-24",
"2026-06-25"
];

const today = new Date();
const formatted =
today.getFullYear() + "-" +
String(today.getMonth()+1).padStart(2,"0") + "-" +
String(today.getDate()).padStart(2,"0");

let day = 0;

for (let i = 0; i < days.length; i++) {
  if (formatted >= days[i]) {
    day = i + 1;
  }
}

const percent = (day / days.length) * 100;

document.getElementById("swimmer").style.left = percent + "%";
document.getElementById("bar").style.width = percent + "%";

document.getElementById("dayText").innerText =
"Day " + day + " of " + days.length;

document.getElementById("dateText").innerText =
today.toLocaleDateString();

</script>

</body>
</html>
